---
- name: "{{ role_name }} | {{ task.name }} | Ensure the {{ devsecops_scripts_dir }} directory"
  ansible.builtin.file:
    path: "{{ devsecops_scripts_dir }}"
    state: directory
    mode: '0750'
  register: result_devsecops_scripts_dir

- name: "{{ role_name }} | {{ task.name }} | Ensure the presence of the update script"
  ansible.builtin.copy:
    dest: "{{ devsecops_scripts_dir }}"
    mode: '0700'
    src: "{{ role_path }}/files/scripts/update_galaxy_roles.py"
    force: true
    backup: false
  when:
    - result_devsecops_scripts_dir is success

- name: "{{ role_name }} | {{ task.name }} | Render requirements.yml"
  ansible.builtin.template:
    src: requirements.yml.j2
    dest: "{{ devsecops_galaxy_requirements_dir }}/requirements.yml"
    mode: '0644'
  register: result_requirements

- name: "{{ role_name }} | {{ task.name }} | Install Galaxy roles"
  ansible.builtin.command:
    cmd: >-
      ansible-galaxy role install
      -r {{ devsecops_galaxy_requirements_dir }}/requirements.yml
      --force
  register: result_galaxy_install
  changed_when: "'was installed successfully' in result_galaxy_install.stdout"
  when:
    - result_requirements is success
    - devsecops_galaxy_roles | length > 0
...
